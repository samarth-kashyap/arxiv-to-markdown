[project]
name = "arxiv-to-markdown"
version = "0.1.0"
description = "Convert arXiv papers to LLM-readable markdown"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "arxiv>=2.1.0",
    "pypandoc>=1.13",
    "requests>=2.31.0",
    "click>=8.1.0",
    "bibtexparser>=1.4.0",
    "tqdm>=4.66.0",
]

[project.scripts]
arxiv-to-md = "arxiv_to_md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arxiv_to_md"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
